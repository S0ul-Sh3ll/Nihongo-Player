name: Build & Release (Windows / macOS / Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} -> ${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: NihongoPlayer-linux-x64.tar.gz
          - os: windows-latest
            asset_name: NihongoPlayer-windows-x64.zip
          - os: macos-14
            asset_name: NihongoPlayer-macos-arm64.dmg
            arch: arm64
          - os: macos-13
            asset_name: NihongoPlayer-macos-x64.dmg
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libmpv (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2

      - name: Install system mpv & export dylib path (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "NIHONGO_LIBMPV=$(brew --prefix)/lib/libmpv.dylib" >> $GITHUB_ENV

      - name: Download libmpv DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path _win_libs | Out-Null
          # Authenticate the API call to avoid shared-runner rate limits (403)
          $headers = @{ "User-Agent" = "gh-actions"; "Authorization" = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          # Prefer the dated x86_64 dev build; avoid the -v3- (AVX2-only) variant
          $asset = $rel.assets | Where-Object { $_.name -match "^mpv-dev-x86_64-\d.*\.7z$" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*-v3-*" } | Select-Object -First 1 }
          if (-not $asset) { Write-Error "No mpv-dev-x86_64 .7z asset found"; $rel.assets.name; exit 1 }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "_win_libs/mpv-dev.7z" -Headers @{ "User-Agent" = "gh-actions" }
          7z x "_win_libs/mpv-dev.7z" -o"_win_libs" -y | Out-Null
          # Find the runtime DLL wherever it landed
          $dllItem = Get-ChildItem -Path _win_libs -Recurse -Include "libmpv-2.dll","mpv-2.dll","mpv-1.dll" | Select-Object -First 1
          if (-not $dllItem) {
            Write-Host "Extracted contents:"; Get-ChildItem -Recurse _win_libs | ForEach-Object { $_.FullName }
            Write-Error "libmpv runtime DLL not found after extraction"; exit 1
          }
          $dll = $dllItem.FullName
          Write-Host "Found libmpv DLL at: $dll"
          "NIHONGO_LIBMPV_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[asr]"
          pip install pyinstaller

      - name: Cache Opus-MT translation model
        uses: actions/cache@v4
        with:
          path: models/
          key: models-opus-mt-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch translation model
        run: |
          python scripts/fetch_models.py

      - name: Build standalone application bundle with PyInstaller
        run: |
          pyinstaller --clean -y packaging/nihongo_player.spec

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar czf "release/${{ matrix.asset_name }}" -C dist NihongoPlayer

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive dist/NihongoPlayer/* "release/${{ matrix.asset_name }}"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          if [ -d "dist/NihongoPlayer.app" ]; then
            hdiutil create -volname NihongoPlayer -srcfolder dist/NihongoPlayer.app -ov -format UDZO "release/${{ matrix.asset_name }}"
          else
            hdiutil create -volname NihongoPlayer -srcfolder dist/NihongoPlayer -ov -format UDZO "release/${{ matrix.asset_name }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*
          generate_release_notes: true
